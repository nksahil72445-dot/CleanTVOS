<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
<title>CleanTVOS</title>
<link rel="stylesheet" href="home.css">
<body>
<div id="glass-focus" aria-hidden="true"></div><header><strong>CleanTVOS</strong><div class="tabs" aria-label="Screens"><button id="home-tab" aria-current="page">Home</button><button id="apps-tab">Apps</button></div><nav aria-label="Quick controls">
<button data-panel="inputs" aria-haspopup="dialog">Inputs</button><button data-panel="wifi" aria-haspopup="dialog">Wi-Fi</button><button data-panel="vpn" id="vpn" aria-haspopup="dialog">VPN</button><button data-panel="settings" aria-haspopup="dialog">Settings</button>
</nav></header>
<main><div id="home-screen">
<section class="hero"><div><time id="clock"></time><p id="date"></p></div><h1 id="featured">Home</h1></section>
<section aria-label="Dock"><div class="grid dock" id="dock"></div></section>
<section id="home-shortcuts" hidden aria-label="Home apps"><div class="grid" id="shortcuts"></div></section></div><section id="apps-screen" aria-labelledby="apps-title" hidden><div class="section-head"><h2 id="apps-title">Apps</h2><p id="move-help" hidden role="status">Choose a position and press OK to place. Back cancels.</p><input id="search" type="search" aria-label="Search apps" placeholder="Search apps"></div><div class="grid" id="apps"></div></section>
</main>
<aside id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title"><h2 id="panel-title"></h2><div id="panel-items"></div></aside>
<p id="status" role="status" hidden></p>
<script src="home.js"></script>
</body>
</html>
